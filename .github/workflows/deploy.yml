name: Deploy to Bunny.net

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs Vite+ and runs `vp install`
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      # Type-checks and builds the web app into apps/web/dist
      - run: vp run web#build
        env:
          VITE_MAP_STYLES: ${{ secrets.VITE_MAP_STYLES }}

      # Deploy to Bunny.net. Uses the Bun that Vite+ manages on CI, so no setup-bun step.
      - run: bun x bunnyup deploy
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}

      # bunnyup switches the pull zone to the new storage zone but doesn't purge the CDN cache,
      # so edges keep serving the old index.html, which references assets the new zone lacks.
      - name: Purge CDN cache
        run: |
          PULL_ZONE_ID=$(jq -r .pullZoneId bunnyup.json)
          curl -fsS -X POST "https://api.bunny.net/pullzone/$PULL_ZONE_ID/purgeCache" \
            -H "AccessKey: $BUNNY_API_KEY"
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
